<style>
:root{
  --ground:#F7F4EC;--surface:#FFFFFF;--surface-2:#EFEBE0;
  --ink:#12211F;--ink-2:#3C4F4B;--ink-3:#6F817C;--line:#DCD6C7;
  --accent:#0B6A5E;--accent-soft:#D9EAE4;
  --sea:#1F6F8B;--sea-soft:#DCEAF0;
  --saffron:#B4741A;--saffron-soft:#F4E6CE;
  --art-dim:1;
  --shadow:0 1px 2px rgba(18,33,31,.06),0 8px 24px rgba(18,33,31,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1817;--surface:#132322;--surface-2:#1B2E2C;
    --ink:#EDE7DA;--ink-2:#B9C7C3;--ink-3:#8A9A96;--line:#26403C;
    --accent:#5FC2AE;--accent-soft:#123A34;
    --sea:#7FC3DC;--sea-soft:#122E3A;
    --saffron:#E2A855;--saffron-soft:#3A2C13;
    --art-dim:.82;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1817;--surface:#132322;--surface-2:#1B2E2C;
  --ink:#EDE7DA;--ink-2:#B9C7C3;--ink-3:#8A9A96;--line:#26403C;
  --accent:#5FC2AE;--accent-soft:#123A34;
  --sea:#7FC3DC;--sea-soft:#122E3A;
  --saffron:#E2A855;--saffron-soft:#3A2C13;
  --art-dim:.82;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;direction:ltr;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",sans-serif;font-size:16px;line-height:1.65;font-variant-numeric:tabular-nums}
body.ar{direction:rtl}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

header{padding:44px 0 26px;border-bottom:1px solid var(--line)}
h1{font-family:Newsreader,Georgia,serif;font-weight:600;font-size:clamp(32px,5.5vw,54px);line-height:1.14;margin:0 0 14px;text-wrap:balance}
body.ar h1{font-family:Amiri,serif;font-weight:700}
.lede{margin:0;max-width:64ch;color:var(--ink-2);font-size:17px}
.meta-row{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:20px;font-size:13px;color:var(--ink-3)}
.meta-row b{color:var(--ink-2);font-weight:600}

.controls{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 0}
.control-inner{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:inherit;font-size:13.5px;font-weight:500;padding:6px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ground)}
.chip .n{opacity:.6;font-size:12px;margin-inline-start:5px}
.toggles{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.tog{font:inherit;font-size:13.5px;font-weight:500;padding:6px 13px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.tog[aria-pressed="true"]{background:var(--sea-soft);border-color:var(--sea);color:var(--sea)}
.tog svg{width:15px;height:15px;fill:currentColor}
.lang{font:inherit;font-size:13px;font-weight:700;padding:6px 14px;border-radius:8px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.sep{flex:1}
select{font:inherit;font-size:13.5px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.sections{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:10px;align-self:flex-start}
.sec{font:inherit;font-size:13.5px;font-weight:600;padding:6px 16px;border-radius:7px;border:0;background:transparent;color:var(--ink-3);cursor:pointer}
.sec[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.mapbox{margin:20px 0 4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mapbox>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink)}
.mapbox>summary::-webkit-details-marker{display:none}
.mapbox>summary .caret{margin-inline-start:auto;font-size:11px;color:var(--ink-3);transition:transform .15s}
.mapbox[open]>summary .caret{transform:rotate(180deg)}
.map-inner{padding:0 16px 16px}
.map-hint{margin:0 0 10px;font-size:12.5px;color:var(--ink-3)}
.map-scroll{overflow-x:auto}
#mapHost svg{direction:ltr;display:block;width:100%;max-width:460px;min-width:340px;height:auto;margin:0 auto;border-radius:10px}
.pin{cursor:pointer}
.pin circle{transition:r .12s}
.pin:hover circle:first-of-type{r:13}
.map-label{font-size:10.5px;fill:var(--ink-3);font-weight:600;paint-order:stroke;stroke:var(--surface-2);stroke-width:3px;stroke-linejoin:round}
.map-num{font-size:10px;font-weight:700;fill:#fff}

.count{padding:18px 0 4px;font-size:13.5px;color:var(--ink-3)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));align-items:stretch;padding:8px 0 40px}
.card{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.card.sea{border-inline-start:3px solid var(--sea)}
.card-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px;flex:1}

.art{position:relative;height:168px;filter:saturate(var(--art-dim)) brightness(var(--art-dim))}
.art svg{width:100%;height:100%;display:block}
.art .rank{position:absolute;inset-inline-end:12px;top:10px;font-family:Amiri,serif;font-size:15px;font-weight:700;
  color:#fff;background:rgba(0,0,0,.32);border-radius:8px;padding:3px 11px;backdrop-filter:blur(3px)}
.art .kind{position:absolute;inset-inline-start:12px;bottom:10px;font-size:11.5px;font-weight:600;
  color:#fff;background:rgba(0,0,0,.28);border-radius:6px;padding:3px 9px;backdrop-filter:blur(3px)}

.name{margin:0;font-size:19px;font-weight:600;line-height:1.3}
.name .alt{display:block;font-size:12.5px;font-weight:400;color:var(--ink-3)}
.tagline{font-size:12.5px;color:var(--ink-3);margin:4px 0 0}
.dish{font-size:13.5px;color:var(--ink-2);margin:0}
.dish b{font-weight:600;color:var(--ink)}

.menu-box{background:var(--surface-2);border-radius:10px;padding:0;overflow:hidden}
.menu-box>summary{list-style:none;cursor:pointer;padding:11px 12px;display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:600;color:var(--ink-2)}
.menu-box>summary::-webkit-details-marker{display:none}
.menu-box>summary svg{width:14px;height:14px;fill:var(--ink-3)}
.menu-box>summary .caret{margin-inline-start:auto;font-size:11px;color:var(--ink-3);transition:transform .15s}
.menu-box[open]>summary .caret{transform:rotate(180deg)}
.menu-inner{padding:0 12px 12px;display:flex;flex-direction:column;gap:9px}
.menu-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.menu-list li{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--ink-2)}
.menu-list .lead{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px)}
.menu-list .p{font-weight:700;color:var(--ink);font-size:13.5px}
.menu-list .p i{font-style:normal;font-weight:500;font-size:11px;color:var(--ink-3);margin-inline-start:3px}
.menu-none{font-size:12.5px;color:var(--ink-3);margin:0}

.actions{display:flex;flex-wrap:wrap;gap:7px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;text-decoration:none;
  padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);transition:border-color .15s,color .15s}
.btn svg{width:14px;height:14px;fill:currentColor}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.map{background:var(--sea-soft);border-color:transparent;color:var(--sea)}
.btn.pics{background:var(--saffron-soft);border-color:transparent;color:var(--saffron)}

.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:11px;margin-top:auto}
.badge{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:5px}
.badge svg{width:12px;height:12px;fill:currentColor}
.b-sea{background:var(--sea-soft);color:var(--sea)}
.b-fam{background:var(--saffron-soft);color:var(--saffron)}
.b-hours{background:var(--accent-soft);color:var(--accent)}
.rating{margin-inline-start:auto;font-size:12.5px;color:var(--ink-3)}
.rating b{color:var(--ink);font-weight:700;font-size:14px}
.note{font-size:12px;color:var(--ink-3);line-height:1.55;margin:0}

.tips{border-top:1px solid var(--line);padding:34px 0 10px}
.tips h2{font-family:Newsreader,Georgia,serif;font-size:27px;margin:0 0 16px;font-weight:600}
body.ar .tips h2{font-family:Amiri,serif;font-weight:700}
.tips ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:9px;color:var(--ink-2);font-size:14.5px;max-width:74ch}
.tips li b{color:var(--ink)}
footer{border-top:1px solid var(--line);margin-top:34px;padding:20px 0 46px;font-size:12.5px;color:var(--ink-3)}
.empty{padding:40px 0;text-align:center;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

<header>
  <div class="wrap">
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
    <div class="meta-row" id="meta"></div>
  </div>
</header>

<div class="controls">
  <div class="wrap control-inner">

      <select id="sortSel"></select>
      <button class="lang" id="langBtn"></button>
    </div>
  </div>
</div>

<main class="wrap">
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden></p>
  <details class="mapbox" id="mapBox" open>
    <summary><span id="mapT"></span><span class="caret">▾</span></summary>
    <div class="map-inner">
      <p class="map-hint" id="mapHint"></p>
      <div class="map-scroll"><div id="mapHost"></div></div>
    </div>
  </details>
  <section class="tips">
    <h2 id="tipsH"></h2>
    <ul id="tipsList"></ul>
  </section>
</main>

<footer><div class="wrap" id="footText"></div></footer>

        <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="${a.a}"/><stop offset="1" stop-color="${a.b}"/></linearGradient></defs>
        <rect width="320" height="118" fill="url(#${gid})"/>
        <circle cx="${34+((x.r*37)%250)}" cy="${18+((x.r*13)%14)}" r="${9+(x.r%4)*2}" fill="#fff" opacity=".13"/>
        ${a.art}
        ${x.sea?'<path d="M0 104c27 0 27 8 54 8s27-8 54-8 27 8 54 8 27-8 54-8 27 8 54 8 27-8 54-8v14H0z" fill="#fff" opacity=".22"/>':''}
      </svg>
      <span class="rank">${num(x.r)}</span>
      <span class="kind">${ar?x.c:CE[x.c]}</span>
    </div>
    <div class="card-body">
      <div>
        <h3 class="name">${ar?x.ar:x.en}<span class="alt">${ar?x.en:x.ar}</span></h3>
        <p class="tagline">${ar?x.d:x.de}</p>
      </div>
      <p class="dish"><b>${t.highlight}</b> ${ar?x.dish:x.dishe}</p>
      <details class="menu-box">
        <summary>${menuIcon} ${t.menuT} <span class="caret">▾</span></summary>
        <div class="menu-inner">
          <ul class="menu-list">${rows}</ul>
          ${pn?`<p class="menu-none">${pn}</p>`:''}
          <a class="btn primary" style="align-self:flex-start" href="${x.menu}" target="_blank" rel="noopener">${menuIcon} ${t.full}</a>
        </div>
      </details>
      <div class="actions">
        <a class="btn map" href="${x.map}" target="_blank" rel="noopener">${pinIcon} ${t.loc}</a>
        <a class="btn pics" href="${pics}" target="_blank" rel="noopener">${picIcon} ${t.pics}</a>
        ${x.tel?`<a class="btn" href="tel:${x.tel}">${telIcon} ${t.call}</a>`:''}
      </div>
      <p class="note">${ar?x.note:x.notee}</p>
      <div class="foot">
        ${x.hours?`<span class="badge b-hours">${clockIcon} ${ar?x.hours:x.hourse}</span>`:''}
        ${x.sea?`<span class="badge b-sea">${waveIcon} ${t.sea}</span>`:''}
        ${x.fam?`<span class="badge b-fam">${famIcon} ${t.fam}</span>`:''}
        <span class="rating">${x.rate?`<b>${num(x.rate.toFixed(1))}</b> ${t.of5} · ${ar?x.rc:x.rce}`:(ar?x.rc:x.rce)}</span>
      </div>
    </div>`;
  return el;
}

const clockIcon='<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 10V6h-2v8h6v-2z"/></svg>';

const ACT=()=>state.section==='cafe'?CAFES:DATA;

function buildChrome(){
  const t=L(),cafe=state.section==='cafe';
  document.body.classList.toggle('ar',state.lang==='ar');
  document.body.setAttribute('lang',state.lang);
  $('h1').textContent=cafe?t.cafeTitle:t.title;
  $('lede').textContent=cafe?t.cafeLede:t.lede;
  $('meta').innerHTML=(cafe?t.cafeMeta:t.meta).map(m=>`<span>${m}</span>`).join('');
  $('togSea').innerHTML=waveIcon+' '+t.sea;
  $('togFam').innerHTML=famIcon+' '+t.fam;
  $('sortLbl').textContent=t.sortLbl;
  $('langBtn').textContent=t.lang;
  $('empty').textContent=t.empty;
  $('mapT').textContent=t.mapT;
  $('mapHint').textContent=t.mapHint;
  $('tipsH').textContent=cafe?t.tipsHCafe:t.tipsH;
  $('tipsList').innerHTML=(cafe?t.tipsCafe:t.tips).map(x=>`<li>${x}</li>`).join('');
  $('footText').textContent=t.foot;
  const sel=$('sortSel');
  sel.innerHTML=t.sorts.map(x=>`<option value="${x[0]}"${x[0]===state.sort?' selected':''}>${x[1]}</option>`).join('');

  const secBox=$('sections');secBox.innerHTML='';
  [['food',t.secFood],['cafe',t.secCafe]].forEach(([k,label])=>{
    const b=document.createElement('button');
    b.className='sec';b.type='button';b.textContent=label;
    b.setAttribute('aria-pressed',state.section===k);
    b.addEventListener('click',()=>{
      if(state.section===k) return;
      state.section=k;state.cuisine=null;state.sort='curated';
      buildChrome();render();
      window.scrollTo({top:0,behavior:'smooth'});
    });
    secBox.appendChild(b);
  });

  const box=$('cuisineChips');box.innerHTML='';
  const data=ACT();
  const list=[null,...[...new Set(data.map(x=>x.c))]];
  list.forEach(c=>{
    const b=document.createElement('button');
    b.className='chip';b.type='button';
    b.setAttribute('aria-pressed',c===state.cuisine);
    const label=c===null?t.all:(state.lang==='ar'?c:CE[c]);
    const n=c===null?data.length:data.filter(x=>x.c===c).length;
    b.innerHTML=label+'<span class="n">'+num(n)+'</span>';
    b.addEventListener('click',()=>{
      state.cuisine=c;
      [...box.children].forEach(x=>x.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      render();
    });
    box.appendChild(b);
  });
  $('togSea').setAttribute('aria-pressed',state.sea);
  $('togFam').setAttribute('aria-pressed',state.fam);
}

const MAP={n:21.755,s:21.495,w:39.072,e:39.242,W:520,H:760};
const KLAT=Math.cos(21.62*Math.PI/180);
function mx(lng){return (lng-MAP.w)/(MAP.e-MAP.w)*MAP.W;}
function my(lat){return (MAP.n-lat)/(MAP.n-MAP.s)*MAP.H;}

const COAST=[[21.755,39.083],[21.741,39.081],[21.734,39.090],[21.733,39.106],[21.729,39.122],[21.726,39.130],
 [21.723,39.124],[21.722,39.107],[21.718,39.093],[21.706,39.083],[21.688,39.080],[21.668,39.084],[21.648,39.092],
 [21.630,39.095],[21.612,39.098],[21.596,39.100],[21.580,39.103],[21.566,39.108],[21.552,39.116],[21.540,39.128],
 [21.530,39.139],[21.520,39.149],[21.508,39.158],[21.495,39.164]];
const DISTRICTS=[[21.700,39.120,'أبحر','Obhur'],[21.648,39.128,'الشراع','Al Shera'],[21.612,39.170,'السلامة','As Salamah'],
 [21.632,39.200,'النهضة','An Nahdah'],[21.596,39.220,'المروة','Al Marwah'],[21.575,39.160,'الروضة','Al Rawdah'],
 [21.590,39.128,'الشاطئ','Ash Shati'],[21.548,39.176,'الأندلس','Al Andalus'],[21.522,39.180,'الحمراء','Al Hamra'],
 [21.556,39.132,'الخالدية','Al Khalidiyah']];

function renderMap(list){
  const t=L(),cafe=state.section==='cafe';
  const color=cafe?'var(--saffron)':'var(--accent)';
  const path=COAST.map((c,i)=>(i?'L ':'M ')+mx(c[1]).toFixed(1)+' '+my(c[0]).toFixed(1)).join(' ');
  const kmPerDegLat=110.57, kmPerPxY=(MAP.n-MAP.s)*kmPerDegLat/MAP.H;
  const barPx=(5/kmPerPxY).toFixed(1);
  const used={};
  const pins=list.filter(x=>x.ll).map(x=>{
    let px=mx(x.ll[1]),py=my(x.ll[0]);
    const key=Math.round(px/20)+'_'+Math.round(py/20);
    const k=used[key]=(used[key]||0)+1;
    if(k>1){const ang=(k-1)*2.1,rad=12*Math.ceil((k-1)/6);px+=Math.cos(ang)*rad;py+=Math.sin(ang)*rad;}
    const X=px.toFixed(1),Y=py.toFixed(1);
    const nm=(state.lang==='ar'?x.ar:x.en).replace(/&/g,'&amp;').replace(/</g,'&lt;');
    return `<a class="pin" href="${x.map}" target="_blank" rel="noopener"><title>${num(x.r)}. ${nm}${x.approx?' ('+t.approxTag+')':''}</title>`+
      `<circle cx="${X}" cy="${Y}" r="10" fill="${color}" opacity="${x.approx?'.55':'.95'}"/>`+
      `<circle cx="${X}" cy="${Y}" r="10" fill="none" stroke="var(--surface)" stroke-width="1.8"${x.approx?' stroke-dasharray="3 2"':''}/>`+
      `<text class="map-num" x="${X}" y="${Y}" text-anchor="middle" dominant-baseline="central">${num(x.r)}</text></a>`;
  }).join('');
  $('mapHost').innerHTML=`
  <svg viewBox="0 0 ${MAP.W} ${MAP.H}" role="img" aria-label="${t.mapT}">
    <rect width="${MAP.W}" height="${MAP.H}" fill="var(--surface-2)"/>
    <path d="${path} L 0 ${MAP.H} L 0 0 Z" fill="var(--sea-soft)"/>
    <path d="${path}" fill="none" stroke="var(--sea)" stroke-width="1.8" opacity=".75"/>
    ${DISTRICTS.map(d=>`<text class="map-label" text-anchor="middle" x="${mx(d[1]).toFixed(1)}" y="${my(d[0]).toFixed(1)}">${state.lang==='ar'?d[2]:d[3]}</text>`).join('')}
    <text class="map-label" text-anchor="end" x="${MAP.W-14}" y="24">${t.north} ↑</text>
    <text class="map-label" text-anchor="start" x="16" y="${MAP.H-40}">${t.sea2}</text>
    <g opacity=".85">
      <line x1="${MAP.W-16-barPx}" y1="${MAP.H-22}" x2="${MAP.W-16}" y2="${MAP.H-22}" stroke="var(--ink-3)" stroke-width="2"/>
      <line x1="${MAP.W-16-barPx}" y1="${MAP.H-27}" x2="${MAP.W-16-barPx}" y2="${MAP.H-17}" stroke="var(--ink-3)" stroke-width="2"/>
      <line x1="${MAP.W-16}" y1="${MAP.H-27}" x2="${MAP.W-16}" y2="${MAP.H-17}" stroke="var(--ink-3)" stroke-width="2"/>
      <text class="map-label" text-anchor="middle" x="${MAP.W-16-barPx/2}" y="${MAP.H-32}">${num(5)} ${t.km}</text>
    </g>
    ${pins}
  </svg>`;
}

function render(){
  const t=L();
  let list=ACT().filter(x=>
    (state.cuisine===null||x.c===state.cuisine) &&
    (!state.sea||x.sea) && (!state.fam||x.fam));
  if(state.sort==='rating') list=[...list].sort((a,b)=>(b.rate||0)-(a.rate||0));
  if(state.sort==='az') list=[...list].sort((a,b)=>(state.lang==='ar'?a.ar.localeCompare(b.ar,'ar'):a.en.localeCompare(b.en,'en')));
  const grid=$('grid');grid.innerHTML='';
  list.forEach(x=>grid.appendChild(card(x)));
  $('count').textContent=(state.section==='cafe'?t.countCafe:t.count)(num(list.length),num(ACT().length));
  $('empty').hidden=list.length>0;
  renderMap(list);
}

$('togSea').addEventListener('click',()=>{state.sea=!state.sea;$('togSea').setAttribute('aria-pressed',state.sea);render();});
$('togFam').addEventListener('click',()=>{state.fam=!state.fam;$('togFam').setAttribute('aria-pressed',state.fam);render();});
$('sortSel').addEventListener('change',e=>{state.sort=e.target.value;render();});
$('langBtn').addEventListener('click',()=>{
  state.lang=state.lang==='ar'?'en':'ar';
  document.title=state.lang==='ar'?'ثلاثون مطعماً في جدة':'Thirty Jeddah Restaurants';
  buildChrome();render();
});

buildChrome();render();
</script>

</body>
